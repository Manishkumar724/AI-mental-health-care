{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TheHope</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --dark-brown: #451a03; --wood: #78350f; --accent: #fb923c; --bg: #fdfaf7; --border: #e3d5ca; --muted: #7f5539; --error: #dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 40% 30%, #ffedd5, #fed7aa 60%, #78350f); background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 8%; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1.5px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--dark-brown); font-size: 1.6rem; font-weight: 800; text-decoration: none; letter-spacing: -1px; }
        .nav-links a { color: var(--muted); text-decoration: none; font-weight: 700; font-size: 0.82rem; margin-left: 20px; }
        .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: rgba(255,255,255,0.98); width: 100%; max-width: 440px; border-radius: 30px; padding: 45px 40px; border: 2px solid var(--dark-brown); box-shadow: 0 30px 60px rgba(69,26,3,0.15); }
        .card-header { text-align: center; margin-bottom: 32px; }
        .card-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
        .card-title { font-size: 1.5rem; font-weight: 800; color: var(--dark-brown); margin-bottom: 6px; }
        .card-sub { font-size: 0.88rem; color: var(--muted); font-weight: 500; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--dark-brown); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-wrap input { width: 100%; padding: 14px 48px 14px 18px; border: 2px solid var(--border); border-radius: 14px; font-family: inherit; font-size: 0.95rem; font-weight: 600; color: var(--dark-brown); background: var(--bg); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-wrap input:focus { border-color: var(--dark-brown); box-shadow: 0 0 0 4px rgba(69,26,3,0.06); background: #fff; }
        .eye-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.1rem; padding: 4px; }
        .alert-error { background: #fee2e2; border: 1.5px solid #fca5a5; border-radius: 12px; padding: 12px 16px; font-size: 0.83rem; font-weight: 700; color: var(--error); margin-bottom: 22px; display: flex; align-items: flex-start; gap: 8px; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--wood), var(--dark-brown)); color: white; border: none; border-radius: 16px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 10px 25px rgba(69,26,3,0.25); transition: all 0.3s; margin-top: 8px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(69,26,3,0.35); }
        .footer-link { text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
        .footer-link a { color: var(--dark-brown); font-weight: 800; text-decoration: none; }
    </style>
</head>
<body>
<nav class="navbar"><a href="/" class="logo">🌱 TheHope</a><div class="nav-links"><a href="/">Home</a><a href="/signup/">Sign Up</a></div></nav>
<div class="page">
    <div class="card">
        <div class="card-header">
            <span class="card-icon">👋</span><div class="card-title">Welcome Back</div><div class="card-sub">Login to continue your journey</div>
        </div>
        
        {% if form.errors %}
        <div class="alert-error">
            <span>⚠</span>
            <div>Invalid username or password. Please try again.</div>
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label for="id_username">Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" id="id_username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="field">
                <label for="id_password">Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
                    <button type="button" class="eye-btn" onclick="togglePwd('id_password',this)">👁</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Login →</button>
        </form>
        <div class="footer-link">New to TheHope? <a href="/signup/">Create an account</a></div>
    </div>
</div>
<script>
function togglePwd(id, btn) { const inp = document.getElementById(id); inp.type = inp.type === 'password' ? 'text' : 'password'; btn.textContent = inp.type === 'password' ? '👁' : '🙈'; }
</script>
</body>
</html>
